
name: Terraform-Ansible-Website-Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ansible-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: true

jobs:

  # ==========================================
  # JOB 1: TERRAFORM - CREATE EC2 INSTANCE
  # ==========================================

  terraform:
    name: Terraform - Provision EC2
    runs-on: ubuntu-latest

    outputs:
      public_ip: ${{ steps.get-ip.outputs.public_ip }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        run: terraform --version

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Get EC2 Public IP
        id: get-ip
        run: |
          EC2_IP=$(terraform output -raw public_ip)
          echo "public_ip=$EC2_IP" >> $GITHUB_OUTPUT
          echo "EC2 Public IP: $EC2_IP"


  # ==========================================
  # JOB 2: ANSIBLE - CONFIGURE EC2 INSTANCE
  # ==========================================

  ansible:
    name: Ansible - Configure EC2
    runs-on: ubuntu-latest
    needs: terraform

    outputs:
      public_ip: ${{ needs.terraform.outputs.public_ip }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Ansible Version
        run: ansible --version

      - name: Configure SSH Private Key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.EC2_SSH_KEY }}' > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Create Ansible Inventory
        run: |
          cat > inventory.ini <<EOF
          [webservers]
          web ansible_host=${{ needs.terraform.outputs.public_ip }} ansible_user=ec2-user ansible_ssh_private_key_file=/home/runner/.ssh/ec2_key ansible_python_interpreter=/usr/bin/python3
          EOF

          cat inventory.ini

      - name: Ping Ansible Inventory
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible webservers -i inventory.ini -m ping -o -vvv \
            --ssh-extra-args='-o StrictHostKeyChecking=no'

      - name: Execute Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook \
            -i inventory.ini \
            playbook.yml \
            --ssh-extra-args='-o StrictHostKeyChecking=no'


  # ==========================================
  # JOB 3: DEPLOY STATIC HTML WEBSITE
  # ==========================================

  deploy:
    name: Deploy Static Website
    runs-on: ubuntu-latest
    needs: ansible

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify HTML File
        run: |
          ls -l index.html
          test -f index.html

      - name: Configure SSH Private Key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.EC2_SSH_KEY }}' > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Copy HTML File to EC2
        env:
          EC2_IP: ${{ needs.ansible.outputs.public_ip }}
        run: |
          scp -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=no \
            index.html \
            ec2-user@$EC2_IP:/tmp/index.html

      - name: Deploy HTML to Nginx Web Directory
        env:
          EC2_IP: ${{ needs.ansible.outputs.public_ip }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=no \
            ec2-user@$EC2_IP \
            "sudo install -m 644 /tmp/index.html /var/www/html/index.html"

      - name: Deployment Complete
        run: |
          echo "Website deployed successfully!"
          echo "Website URL: http://${{ needs.ansible.outputs.public_ip }}"
