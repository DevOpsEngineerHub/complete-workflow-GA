
name: AWS-Terraform-Ansible-HTTPD-Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-ec2-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: true

jobs:

  # ==========================================
  # JOB 1: TERRAFORM - CREATE EC2 INSTANCE
  # ==========================================

  terraform:
    name: Terraform - Provision EC2
    runs-on: ubuntu-latest

    outputs:
      public_ip: ${{ steps.get-ip.outputs.public_ip }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        run: terraform --version

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Get EC2 Public IP
        id: get-ip
        run: |
          EC2_IP=$(terraform output -raw public_ip)
          echo "public_ip=$EC2_IP" >> "$GITHUB_OUTPUT"
          echo "EC2 Public IP: $EC2_IP"


  # ==========================================
  # JOB 2: ANSIBLE - INSTALL APACHE HTTPD
  # ==========================================

  ansible:
    name: Ansible - Configure Apache HTTPD
    runs-on: ubuntu-latest
    needs: terraform

    outputs:
      public_ip: ${{ needs.terraform.outputs.public_ip }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Ansible Version
        run: ansible --version

      - name: Configure SSH Private Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Wait for EC2 SSH
        env:
          EC2_IP: ${{ needs.terraform.outputs.public_ip }}
        run: |
          for i in {1..30}; do
            if ssh -i ~/.ssh/ec2_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 \
              ec2-user@$EC2_IP "echo SSH Connected"; then
              exit 0
            fi

            echo "Waiting for EC2 SSH..."
            sleep 10
          done

          echo "EC2 SSH connection failed"
          exit 1

      - name: Create Ansible Inventory
        env:
          EC2_IP: ${{ needs.terraform.outputs.public_ip }}
        run: |
          cat > inventory.ini <<EOF
          [webservers]
          web ansible_host=$EC2_IP ansible_user=ec2-user ansible_ssh_private_key_file=/home/runner/.ssh/ec2_key ansible_python_interpreter=/usr/bin/python3
          EOF

          cat inventory.ini

      - name: Ping Ansible Inventory
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible webservers \
            -i inventory.ini \
            -m ping \
            -vvv

      - name: Execute Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook \
            -i inventory.ini \
            playbook.yml


  # ==========================================
  # JOB 3: DEPLOY STATIC HTML USING HTTPD
  # ==========================================

  deploy:
    name: Deploy HTML Website
    runs-on: ubuntu-latest
    needs: ansible

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify HTML File
        run: |
          echo "Checking index.html..."
          ls -l index.html
          test -f index.html

      - name: Configure SSH Private Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Copy HTML File to EC2
        env:
          EC2_IP: ${{ needs.ansible.outputs.public_ip }}
        run: |
          scp -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=no \
            index.html \
            ec2-user@$EC2_IP:/tmp/index.html

      - name: Deploy HTML to Apache HTTPD
        env:
          EC2_IP: ${{ needs.ansible.outputs.public_ip }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=no \
            ec2-user@$EC2_IP \
            "sudo mkdir -p /var/www/html && \
             sudo install -m 644 /tmp/index.html /var/www/html/index.html"

          echo "HTML deployed successfully!"

      - name: Verify Website
        env:
          EC2_IP: ${{ needs.ansible.outputs.public_ip }}
        run: |
          for i in {1..10}; do
            if curl -fsS "http://$EC2_IP/" -o /dev/null; then
              echo "Website is accessible!"
              echo "Website URL: http://$EC2_IP"
              exit 0
            fi
            echo "Waiting for HTTPD..."
            sleep 5
          done

          echo "Website verification failed"
          exit 1

      - name: Deployment Summary
        env:
          EC2_IP: ${{ needs.ansible.outputs.public_ip }}
        run: |
          echo "=================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "=================================="
          echo "EC2 Public IP: $EC2_IP"
          echo "Web Server: Apache HTTPD"
          echo "URL: http://$EC2_IP"
          echo "=================================="
